name: Test iOS Example App

on: [push, pull_request]

jobs:
  react-native-ios:
    runs-on: macos-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
    - name: Checkout project
      uses: actions/checkout@v3

    - name: Specify node version
      uses: actions/setup-node@v3
      with:
        node-version: 16

    - name: Setup Detox
      run: |
        brew tap wix/brew
        brew trust --formula wix/brew/applesimutils
        brew install applesimutils

    - name: Install node_modules
      working-directory: example/RNBackgroundExample/
      run: |
        yarn install --frozen-lockfile
        sed -i '' 's#boostorg.jfrog.io/artifactory/main/release/1.76.0/source#archives.boost.io/release/1.76.0/source#' node_modules/react-native/third-party-podspecs/boost.podspec
        sed -i '' "/'-Werror',/d" node_modules/react-native/ReactCommon/yoga/Yoga.podspec
        npx pod-install ios

    - name: Deploy
      working-directory: example/RNBackgroundExample/
      run:
        yarn deploy/release/ios

    - name: iOS test
      working-directory: example/RNBackgroundExample/
      timeout-minutes: 25
      run: |
        npx detox clean-framework-cache && npx detox build-framework-cache
        node e2e/start-server.js &
        # Runner images change their simulators; use the first iPhone available.
        DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].name')
        echo "Simulator: $DEVICE"
        # Boot it before Detox: the first boot of a fresh iOS 26 simulator can
        # outlast Detox's 300 s setup timeout.
        xcrun simctl boot "$DEVICE" || true
        time xcrun simctl bootstatus "$DEVICE" -b
        yarn e2e/test/ios --device-name "$DEVICE"
